<div class="search-wrapper container py-5">
  <div class="search-hero text-center mb-4">
    <h1 class="search-title">Explore GitHub Developers</h1>
    <p class="search-subtitle">Search any GitHub username to see their profile, repos & local weather</p>
  </div>

  <div class="search-input-wrap">
    <span class="search-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
    </span>
    <input type="text" class="search-input" placeholder="Search a GitHub user... (e.g. torvalds)"
      [formControl]="searchControl" />
    <span class="search-loader" *ngIf="loading">
      <svg class="spinner" viewBox="0 0 50 50" width="18" height="18">
        <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="4"></circle>
      </svg>
    </span>
  </div>
</div>
