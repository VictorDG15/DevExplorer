<div class="repos-section container mt-3 pb-5">
  <div class="repos-header">
    <h3 class="repos-title">Repositories</h3>
    <span class="repos-count" *ngIf="repos.length">{{ repos.length }}</span>
  </div>

  <div class="repos-grid">
    <a *ngFor="let repo of repos" [href]="repo.html_url" target="_blank" class="repo-card">
      <div class="repo-card-top">
        <span class="repo-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
          </svg>
        </span>
        <h6 class="repo-name">{{ repo.name }}</h6>
        <span class="repo-arrow">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="7" y1="17" x2="17" y2="7" />
            <polyline points="7 7 17 7 17 17" />
          </svg>
        </span>
      </div>

      <p class="repo-desc">{{ repo.description || 'No description provided.' }}</p>

      <div class="repo-meta">
        <span class="repo-lang" *ngIf="repo.language">
          <span class="lang-dot"></span>
          {{ repo.language }}
        </span>
        <span class="repo-stars" *ngIf="repo.stargazers_count > 0">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
          </svg>
          {{ repo.stargazers_count }}
        </span>
        <span class="repo-forks" *ngIf="repo.forks_count && repo.forks_count > 0">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="6" y1="3" x2="6" y2="15" />
            <circle cx="18" cy="6" r="3" />
            <circle cx="6" cy="18" r="3" />
            <circle cx="6" cy="6" r="3" />
            <path d="M18 9a9 9 0 0 1-9 9" />
          </svg>
          {{ repo.forks_count }}
        </span>
      </div>
    </a>
  </div>
</div>
